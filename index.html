    <div class="scroll-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <span data-slot="scroll-progress" aria-hidden="true"></span>
    </div>
    <a class="skip-link" href="#main" data-slot="skip-link">Skip to content</a>
    <header class="site-header site-shell" id="top">
      <div class="status-bar" role="group" aria-label="Profile status">
        <a class="status-name" href="#top" data-slot="name"></a>
        <span class="status-location">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#location"></use></svg>
          <span class="status-label" data-slot="location-label"></span>
          <span data-slot="location"></span>
        </span>
      </div>
      <div class="header-tools">
        <nav class="site-navigation" aria-label="Main navigation">
          <span class="nav-indicator" aria-hidden="true"></span>
          <a href="#about" data-nav="about"></a>
          <a href="#skills" data-nav="skills"></a>
          <a href="#projects" data-nav="projects"></a>
          <a href="#contact" data-nav="contact"></a>
        </nav>
        <div class="header-controls">
          <button class="locale-toggle" type="button" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#globe"></use></svg>
            <span data-slot="locale-label"></span>
          </button>
          <button class="theme-toggle" type="button" aria-pressed="false"></button>

      <span class="grid-mark grid-mark--top-end" aria-hidden="true">+</span>
      <span class="grid-mark grid-mark--bottom-start" aria-hidden="true">+</span>
      <span class="grid-mark grid-mark--bottom-end" aria-hidden="true">+</span>
      <section id="hero" aria-labelledby="hero-title">
        <div class="hero-layout">
          <div class="hero-copy" data-slot="hero-copy"></div>
          <aside class="profile-spec" data-slot="hero-spec"></aside>

      <section id="about" aria-labelledby="about-title"></section>
      <section id="skills" aria-labelledby="skills-title"></section>
      <section id="projects" aria-labelledby="projects-title">
        <div class="section-heading">
          <p class="section-index" data-slot="projects-index"></p>
          <div class="section-heading-main">
            <h2 class="section-title" id="projects-title" data-slot="projects-title">

        </p>

      <section id="contact" aria-labelledby="contact-title">

          <p class="section-index" data-slot="contact-index"></p>

          <div class="contact-intro">
            <p class="contact-description" data-slot="contact-description"></p>
            <ul class="contact-channels" data-slot="contact-channels"></ul>
            <ul class="contact-socials" data-slot="contact-socials" hidden></ul>
            <div class="contact-availability">
              <span class="availability-indicator" aria-hidden="true"></span>
              <span data-slot="contact-availability"></span>
            </div>
            <p class="response-time" data-slot="contact-response"></p>
          </div>
          <div data-slot="contact-form"></div>
        </div>

    </main>
    <footer class="site-footer site-shell">
      <span data-slot="copyright"></span>
